name: Documentation Wiki

on:
  pull_request:
    paths: ['docs/**', '.github/wiki_sync.py', '.github/test_wiki_sync.py', '.github/workflows/wiki.yml']
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-wiki-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test and render documentation without credentials
        run: make wiki-check

  publish:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate the exact latest source before loading credentials
        run: make wiki-check
      - name: Synchronize the initialized Wiki
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -eu
          if [ -z "$WIKI_TOKEN" ]; then
            echo 'Configure WIKI_TOKEN and create the initial Wiki page; see docs/wiki-publication.md.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          wiki_directory="$RUNNER_TEMP/documentation-wiki"
          export GIT_ASKPASS="$RUNNER_TEMP/wiki-askpass.sh"
          cat > "$GIT_ASKPASS" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$WIKI_TOKEN" ;;
          esac
          ASKPASS
          chmod 700 "$GIT_ASKPASS"
          trap 'rm -f "$GIT_ASKPASS"' EXIT
          git -c credential.helper= clone --depth 1 "https://github.com/$GITHUB_REPOSITORY.wiki.git" "$wiki_directory"
          source_revision="$(git rev-parse HEAD)"
          python3 .github/wiki_sync.py --output "$wiki_directory" --repository "$GITHUB_REPOSITORY" --revision "$source_revision"
          git -C "$wiki_directory" config user.name 'github-actions[bot]'
          git -C "$wiki_directory" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$wiki_directory" add --all
          if git -C "$wiki_directory" diff --cached --quiet; then
            echo 'Wiki already matches current documentation.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -C "$wiki_directory" commit -m "docs: synchronize $source_revision"
          git -C "$wiki_directory" -c credential.helper= push origin HEAD
          echo "Published docs from $source_revision to the repository Wiki." >> "$GITHUB_STEP_SUMMARY"
